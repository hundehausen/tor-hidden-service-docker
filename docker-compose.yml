services:
  # Example web service
  web:
    image: nginx:alpine
    container_name: web-container
    volumes:
      - ./example-site:/usr/share/nginx/html
    networks:
      - tor-network

  # Tor hidden service
  tor:
    build: .
    container_name: tor-hidden-service-2
    environment:
      HS_WEB: web:80:80-100

    networks:
      - tor-network
    volumes:
      - tor-data:/var/lib/tor  # Persist onion addresses

networks:
  tor-network:
    driver: bridge

volumes:
  tor-data:
    driver: local
