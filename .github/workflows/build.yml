name: Build and Test

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'torrc'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'torrc'
      - '.github/workflows/build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
    
    - name: Build Docker image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        platforms: ${{ matrix.platform }}
        push: false
        load: true
        tags: tor-hidden-service:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Test Docker image
      run: |
        docker run --name tor-test -d tor-hidden-service:test
        # Poll up to 90s for full bootstrap. QEMU-emulated arm64 is much
        # slower than native amd64, so a fixed sleep is unreliable across
        # architectures.
        deadline=$((SECONDS + 90))
        until docker logs tor-test 2>&1 | grep -q "Bootstrapped 100%"; do
          if [ $SECONDS -ge $deadline ]; then
            echo "::error::Tor did not reach Bootstrapped 100% within 90s"
            docker logs tor-test
            exit 1
          fi
          sleep 2
        done
        docker logs tor-test
        docker stop tor-test && docker rm tor-test
    
  publish:
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
    
    - name: Login to GitHub Container Registry
      uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract Tor version
      id: tor_version
      run: |
        TOR_VERSION=$(grep -oP 'TOR_VERSION=\K[^"]+' Dockerfile)
        echo "TOR_VERSION=$TOR_VERSION" >> $GITHUB_ENV
        echo "tor_version=$TOR_VERSION" >> $GITHUB_OUTPUT
    
    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
      with:
        images: ghcr.io/${{ github.repository_owner }}/tor-hidden-service
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=tor-${{ env.TOR_VERSION }},enable=${{ env.TOR_VERSION != '' }}
    
    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        sbom: true
        provenance: mode=max
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        labels: ${{ steps.meta.outputs.labels }}

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.1.1

    - name: Sign the published image digest
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
        TAGS: ${{ steps.meta.outputs.tags }}
        IMAGE: ghcr.io/${{ github.repository_owner }}/tor-hidden-service
      shell: bash
      run: |
        set -euo pipefail
        IFS=$'\n\t'
        images=()
        for tag in ${TAGS}; do
          images+=("${tag}@${DIGEST}")
        done
        cosign sign --yes "${images[@]}"
